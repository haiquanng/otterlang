<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3eee5" />
    <meta name="description" content="Learn English from real content." />
    <title>OtterLang</title>
    <script>
      // Runs before first paint so a saved theme never flashes the other one.
      // Keep in sync with src/lib/theme.ts (key and colors).
      try {
        var choice = localStorage.getItem('otter-theme')
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (choice === 'light' || choice === 'dark') document.documentElement.dataset.theme = choice
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#15171a' : '#f3eee5')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
