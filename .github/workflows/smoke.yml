name: Smoke test

# After Vercel reports a successful production deployment, check the live app end to end.
# Also runnable by hand from the Actions tab.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    env:
      # The public domain, not the per-deployment URL (those sit behind Vercel's login).
      APP_URL: ${{ vars.PRODUCTION_URL || 'https://otterlang.vercel.app' }}
    steps:
      - name: App shell loads
        run: curl -fsS --retry 3 --max-time 30 "$APP_URL/" | grep -q '<div id="root">'

      - name: Client routes fall back to the app
        run: curl -fsS --max-time 30 "$APP_URL/library" | grep -q '<div id="root">'

      - name: API answers through the Vercel proxy
        # Render's free instance may be asleep: allow about two minutes for a cold start.
        run: >-
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --max-time 60
          "$APP_URL/api/health" | grep -q '"status":"ok"'

      - name: Protected API rejects anonymous calls
        run: test "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/me")" = "401"
